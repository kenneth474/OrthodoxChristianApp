# application-prod.properties: extra settings for when the app runs online.
#
# Spring Boot reads application.properties first, then this file on top of it,
# but only when the "prod" (production) profile is switched on. Online it is:
# render.yaml and the Dockerfile set SPRING_PROFILES_ACTIVE=prod. On your
# computer it isn't, so nothing here affects local development.

# ---- Database: PostgreSQL instead of H2 ----
# Online, files saved inside the app's container are wiped on every restart
# and update, so accounts live in a separate PostgreSQL database instead.
# The host gives us its address as DATABASE_URL; DatabaseUrl.java splits that
# into the three app.database.* values used here. If DATABASE_URL is missing,
# the app refuses to start (its log says: 'url' must start with "jdbc")
# rather than quietly using a database that gets wiped.
spring.datasource.url=${app.database.url}
spring.datasource.username=${app.database.username}
spring.datasource.password=${app.database.password}
# At most 5 connections to the database at once: plenty for this app, and
# each connection uses memory on both sides.
spring.datasource.hikari.maximum-pool-size=5

# ---- Running behind Render's front door ----
# Visitors connect to Render with https://, and Render passes the request on
# to our app over plain http inside its network, adding "X-Forwarded-..."
# headers that say what the visitor really used. "framework" tells Spring to
# trust those headers, so the app knows it's being reached over https (needed
# for correct Google sign-in return addresses, and for HSTS, which tells
# browsers to always use https).
server.forward-headers-strategy=framework
# Only send the sign-in cookie over https, never plain http. (The "stay
# signed in" cookie does the same by itself; see StaySignedIn.java.)
server.servlet.session.cookie.secure=true

# ---- Saving memory (the free plan has 512 MB) ----
# At most 50 requests handled at the same time (Tomcat's default is 200).
server.tomcat.threads.max=50
