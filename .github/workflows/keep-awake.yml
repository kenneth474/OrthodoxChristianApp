# keep-awake.yml: visits the online app every 10 minutes, so it doesn't sleep.
#
# On Render's free plan the app goes to sleep after 15 minutes without
# visitors, and a sleeping app can't send the notifications people asked for
# at a certain time (see notify/NotificationScheduler.java). A visit every 10
# minutes keeps it awake around the clock. That uses about 744 of the free
# plan's 750 hours a month: it fits, but only for one free service. On a paid
# Render plan the app never sleeps, and this file can simply be deleted.
#
# GitHub runs scheduled workflows when it can, sometimes several minutes late.
# That's fine: the app still sends anything that came due while it waited
# (up to 3 hours late). GitHub also pauses schedules in a repository with no
# commits for 60 days; the next push switches them back on.

name: Keep the app awake

on:
  schedule:
    - cron: '*/10 * * * *'    # every 10 minutes (GitHub's clock is UTC)
  workflow_dispatch:           # or start it by hand from the Actions tab

# It only visits a public address, so it needs no access to the repository.
permissions: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Waking up from sleep can take a minute, so allow two, and try 3 times.
      - name: Visit the app
        run: >
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 120
          --output /dev/null https://orthodox-daily.onrender.com/api/auth/options
